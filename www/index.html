<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<title>Music Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f0f;--surface:#1a1a1a;--surface2:#252525;--primary:#1db954;--text:#fff;--text2:#aaa;--danger:#e74c3c;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100vh;max-width:500px;margin:0 auto}

/* Header */
header{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--primary),#1ed760);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tab-btns{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius);padding:3px}
.tab-btn{padding:8px 16px;border:none;background:none;color:var(--text2);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.tab-btn.active{background:var(--surface2);color:var(--text)}

/* Player bar */
#player-bar{background:var(--surface);border-radius:var(--radius);margin:0 12px;padding:12px 16px;flex-shrink:0}
.player-top{display:flex;align-items:center;gap:12px}
#album-art{width:48px;height:48px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.player-info{flex:1;min-width:0}
#current-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#current-artist{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-actions{display:flex;gap:8px;align-items:center}
.player-btn{width:36px;height:36px;border:none;background:var(--surface2);color:var(--text);border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.player-btn:active{transform:scale(.9)}
.player-btn.play-btn{width:44px;height:44px;background:var(--primary);color:#000;font-size:20px}
#seek-bar{width:100%;margin-top:10px;height:4px;-webkit-appearance:none;appearance:none;background:var(--surface2);border-radius:2px;outline:none}
#seek-bar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--primary);cursor:pointer}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px}

/* Content area */
#content{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
#content::-webkit-scrollbar{width:4px}
#content::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}

/* Track list */
.track-item{display:flex;align-items:center;padding:12px;border-radius:var(--radius);margin-bottom:4px;cursor:pointer;transition:.15s;gap:12px;position:relative}
.track-item:active,.track-item.active{background:var(--surface)}
.track-item.playing{background:var(--surface);border:1px solid var(--primary)}
.track-num{width:24px;height:24px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2);flex-shrink:0}
.track-item.playing .track-num{background:var(--primary);color:#000}
.track-info{flex:1;min-width:0}
.track-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta{font-size:11px;color:var(--text2);margin-top:2px}
.track-actions{display:flex;gap:4px;flex-shrink:0}
.track-actions button{width:32px;height:32px;border:none;background:none;color:var(--text2);border-radius:8px;font-size:14px;cursor:pointer;transition:.2s}
.track-actions button:active{background:var(--surface2);color:var(--text)}

/* YouTube section */
.yt-input-area{display:flex;gap:8px;margin-bottom:16px}
#yt-url{flex:1;padding:12px 16px;background:var(--surface);border:1px solid var(--surface2);border-radius:var(--radius);color:var(--text);font-size:14px;outline:none;transition:.2s}
#yt-url:focus{border-color:var(--primary)}
#yt-url::placeholder{color:var(--text2)}
.yt-btn{padding:12px 20px;background:var(--primary);color:#000;border:none;border-radius:var(--radius);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:.2s}
.yt-btn:active{transform:scale(.95)}
.yt-btn:disabled{opacity:.5;pointer-events:none}
#download-status{margin-top:12px;padding:12px;background:var(--surface);border-radius:var(--radius);font-size:13px;color:var(--text2);display:none}
#download-status.error{color:var(--danger);display:block}
#download-status.success{color:var(--primary);display:block}
#download-status.info{display:block}
.progress-bar{height:4px;background:var(--surface2);border-radius:2px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}

/* Rename modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:360px}
.modal h3{font-size:18px;margin-bottom:16px}
.modal input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--surface2);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none;margin-bottom:16px}
.modal input:focus{border-color:var(--primary)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{padding:10px 20px;border:none;border-radius:var(--radius);font-weight:600;font-size:14px;cursor:pointer;transition:.2s}
.btn-cancel{background:var(--surface2);color:var(--text)}
.btn-confirm{background:var(--primary);color:#000}
.btn-danger{background:var(--danger);color:#fff}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state h3{font-size:16px;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:13px;line-height:1.5}

/* Toast */
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}

/* Hidden file input */
#file-input{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🎵 Music Player</h1>
    <div class="tab-btns">
      <button class="tab-btn active" data-tab="library">📁 Bibliothèque</button>
      <button class="tab-btn" data-tab="youtube">⬇ YouTube</button>
    </div>
  </header>

  <div id="player-bar">
    <div class="player-top">
      <div id="album-art">🎧</div>
      <div class="player-info">
        <div id="current-title">Aucune piste</div>
        <div id="current-artist">Sélectionne un fichier</div>
      </div>
      <div class="player-actions">
        <button class="player-btn" id="btn-prev" title="Précédent">⏮</button>
        <button class="player-btn play-btn" id="btn-play" title="Lecture">▶</button>
        <button class="player-btn" id="btn-next" title="Suivant">⏭</button>
      </div>
    </div>
    <input type="range" id="seek-bar" min="0" max="100" value="0">
    <div class="time-row">
      <span id="time-current">0:00</span>
      <span id="time-duration">0:00</span>
    </div>
  </div>

  <div id="content">
    <!-- Library tab -->
    <div id="tab-library">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button id="btn-add-files" style="flex:1;padding:10px;background:var(--surface);border:2px dashed var(--surface2);border-radius:var(--radius);color:var(--text2);font-size:13px;cursor:pointer;transition:.2s">➕ Ajouter des fichiers</button>
        <button id="btn-add-folder" style="flex:1;padding:10px;background:var(--surface);border:2px dashed var(--surface2);border-radius:var(--radius);color:var(--text2);font-size:13px;cursor:pointer;transition:.2s">📂 Dossier</button>
      </div>
      <div id="track-list"></div>
      <div id="empty-library" class="empty-state">
        <div class="icon">🎶</div>
        <h3>Aucune musique</h3>
        <p>Ajoute des fichiers audio pour commencer</p>
      </div>
    </div>

    <!-- YouTube tab -->
    <div id="tab-youtube" style="display:none">
      <div class="yt-input-area">
        <input type="text" id="yt-url" placeholder="Colle un lien YouTube ici...">
        <button class="yt-btn" id="btn-download">⬇ MP3</button>
      </div>
      <div id="download-status"></div>
      <div style="margin-top:12px">
        <h3 style="font-size:14px;color:var(--text2);margin-bottom:8px">Téléchargements récents</h3>
        <div id="downloads-list"></div>
      </div>
    </div>
  </div>

  <input type="file" id="file-input" accept="audio/*" multiple>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="rename-modal" style="display:none">
  <div class="modal">
    <h3>✏️ Renommer</h3>
    <input type="text" id="rename-input" placeholder="Nouveau nom...">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeRename()">Annuler</button>
      <button class="btn-confirm" onclick="confirmRename()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="delete-modal" style="display:none">
  <div class="modal">
    <h3>🗑️ Supprimer ?</h3>
    <p style="color:var(--text2);font-size:13px;margin-bottom:16px" id="delete-filename"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDelete()">Annuler</button>
      <button class="btn-danger" onclick="confirmDelete()">Supprimer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===== STATE =====
let audio = null;
let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let renameTarget = null;
let deleteTarget = null;
const API_BASE = 'https://music-player-app-production.up.railway.app';

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  loadPlaylist();
  initTabs();
  initPlayer();
  initButtons();
  initSeekBar();
});

// ===== TABS =====
function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('tab-library').style.display = tab === 'library' ? 'block' : 'none';
      document.getElementById('tab-youtube').style.display = tab === 'youtube' ? 'block' : 'none';
    });
  });
}

// ===== PLAYLIST PERSISTENCE =====
function loadPlaylist() {
  try {
    const saved = localStorage.getItem('music_playlist');
    if (saved) playlist = JSON.parse(saved);
  } catch(e) { playlist = []; }
  renderTrackList();
}

function savePlaylist() {
  localStorage.setItem('music_playlist', JSON.stringify(playlist));
}

// ===== FILE LOADING =====
function initButtons() {
  document.getElementById('btn-add-files').addEventListener('click', () => {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', handleFiles);
  document.getElementById('btn-download').addEventListener('click', downloadYouTube);
  document.getElementById('yt-url').addEventListener('keydown', e => {
    if (e.key === 'Enter') downloadYouTube();
  });
}

function handleFiles(e) {
  const files = Array.from(e.target.files).filter(f => f.type.startsWith('audio/') || f.name.match(/\.(mp3|wav|ogg|flac|m4a|aac)$/i));
  if (files.length === 0) {
    showToast('Aucun fichier audio détecté');
    return;
  }
  
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const exists = playlist.find(t => t.name === file.name);
    if (exists) {
      exists.url = url;
      exists.blob = file;
    } else {
      playlist.push({
        name: file.name,
        url: url,
        blob: file,
        size: file.size,
        added: Date.now()
      });
    }
  });
  
  savePlaylist();
  renderTrackList();
  e.target.value = '';
  showToast(`${files.length} fichier(s) ajouté(s)`);
}

// ===== RENDER =====
function renderTrackList() {
  const list = document.getElementById('track-list');
  const empty = document.getElementById('empty-library');
  
  if (playlist.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  
  list.innerHTML = playlist.map((track, i) => `
    <div class="track-item ${currentIndex === i ? 'playing' : ''}" data-index="${i}">
      <div class="track-num">${currentIndex === i && isPlaying ? '⏸' : i + 1}</div>
      <div class="track-info" onclick="playTrack(${i})">
        <div class="track-name">${escapeHtml(track.name)}</div>
        <div class="track-meta">${formatSize(track.size)} · ${new Date(track.added).toLocaleDateString('fr')}</div>
      </div>
      <div class="track-actions">
        <button onclick="event.stopPropagation();openRename(${i})" title="Renommer">✏️</button>
        <button onclick="event.stopPropagation();openDelete(${i})" title="Supprimer">🗑️</button>
      </div>
    </div>
  `).join('');
}

// ===== PLAYER =====
function initPlayer() {
  audio = document.createElement('audio');
  audio.addEventListener('timeupdate', updateSeek);
  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('time-duration').textContent = formatTime(audio.duration);
    document.getElementById('seek-bar').max = audio.duration || 0;
  });
  audio.addEventListener('ended', nextTrack);
  audio.addEventListener('play', () => { isPlaying = true; updatePlayBtn(); });
  audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); });
  audio.addEventListener('error', () => showToast('Erreur de lecture'));
  
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-prev').addEventListener('click', prevTrack);
  document.getElementById('btn-next').addEventListener('click', nextTrack);
}

function playTrack(index) {
  if (index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const track = playlist[index];
  audio.src = track.url;
  audio.play().catch(() => showToast('Impossible de lire ce fichier'));
  document.getElementById('current-title').textContent = track.name.replace(/\.[^.]+$/, '');
  document.getElementById('current-artist').textContent = formatSize(track.size);
  document.getElementById('album-art').textContent = '🎵';
  renderTrackList();
}

function togglePlay() {
  if (!audio.src && playlist.length > 0) { playTrack(0); return; }
  if (!audio.src) { showToast('Ajoute des fichiers d\'abord'); return; }
  if (isPlaying) audio.pause();
  else audio.play();
}

function updatePlayBtn() {
  document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
}

function nextTrack() {
  if (playlist.length === 0) return;
  const next = (currentIndex + 1) % playlist.length;
  playTrack(next);
}

function prevTrack() {
  if (playlist.length === 0) return;
  const prev = currentIndex <= 0 ? playlist.length - 1 : currentIndex - 1;
  playTrack(prev);
}

// ===== SEEK BAR =====
function initSeekBar() {
  const bar = document.getElementById('seek-bar');
  bar.addEventListener('input', () => {
    if (audio.duration) audio.currentTime = bar.value;
  });
}

function updateSeek() {
  const bar = document.getElementById('seek-bar');
  bar.value = audio.currentTime || 0;
  document.getElementById('time-current').textContent = formatTime(audio.currentTime);
}

// ===== RENAME =====
function openRename(index) {
  renameTarget = index;
  const track = playlist[index];
  document.getElementById('rename-input').value = track.name.replace(/\.[^.]+$/, '');
  document.getElementById('rename-modal').style.display = 'flex';
  document.getElementById('rename-input').focus();
  document.getElementById('rename-input').select();
}

function closeRename() {
  document.getElementById('rename-modal').style.display = 'none';
  renameTarget = null;
}

function confirmRename() {
  if (renameTarget === null) return;
  let newName = document.getElementById('rename-input').value.trim();
  if (!newName) { showToast('Nom invalide'); return; }
  
  const oldTrack = playlist[renameTarget];
  const ext = oldTrack.name.split('.').pop();
  if (!newName.endsWith('.' + ext)) newName += '.' + ext;
  
  // Try to rename the actual file if it's a blob/file
  if (oldTrack.blob && oldTrack.blob instanceof File) {
    // Can't rename File objects, but we rename the display name
  }
  
  const oldUrl = oldTrack.url;
  playlist[renameTarget].name = newName;
  
  // Update current playing info
  if (currentIndex === renameTarget) {
    document.getElementById('current-title').textContent = newName.replace(/\.[^.]+$/, '');
  }
  
  savePlaylist();
  renderTrackList();
  closeRename();
  showToast('Renommé : ' + newName);
}

// ===== DELETE =====
function openDelete(index) {
  deleteTarget = index;
  document.getElementById('delete-filename').textContent = playlist[index].name;
  document.getElementById('delete-modal').style.display = 'flex';
}

function closeDelete() {
  document.getElementById('delete-modal').style.display = 'none';
  deleteTarget = null;
}

function confirmDelete() {
  if (deleteTarget === null) return;
  const deletedName = playlist[deleteTarget].name;
  
  if (deleteTarget === currentIndex) {
    audio.pause();
    audio.src = '';
    currentIndex = -1;
    isPlaying = false;
    updatePlayBtn();
    document.getElementById('current-title').textContent = 'Aucune piste';
    document.getElementById('current-artist').textContent = 'Sélectionne un fichier';
  } else if (deleteTarget < currentIndex) {
    currentIndex--;
  }
  
  // Revoke blob URL
  if (playlist[deleteTarget].url && playlist[deleteTarget].url.startsWith('blob:')) {
    URL.revokeObjectURL(playlist[deleteTarget].url);
  }
  
  playlist.splice(deleteTarget, 1);
  savePlaylist();
  renderTrackList();
  closeDelete();
  showToast('Supprimé : ' + deletedName);
}

// ===== YOUTUBE DOWNLOAD =====
async function downloadYouTube() {
  const url = document.getElementById('yt-url').value.trim();
  if (!url) { showToast('Entre un lien YouTube'); return; }
  
  const status = document.getElementById('download-status');
  const btn = document.getElementById('btn-download');
  
  btn.disabled = true;
  status.className = 'info';
  status.innerHTML = '⏳ Téléchargement en cours...<div class="progress-bar"><div class="progress-fill" style="width:30%"></div></div>';
  status.style.display = 'block';
  
  try {
    const resp = await fetch(API_BASE + '/api/youtube/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || 'Erreur serveur');
    }
    
    status.innerHTML = '✅ Conversion terminée ! Téléchargement du fichier...';
    status.className = 'success';
    
    // Get the MP3 as blob
    const blob = await resp.blob();
    
    // Get filename from Content-Disposition or default
    const disposition = resp.headers.get('Content-Disposition');
    let filename = 'youtube-download.mp3';
    if (disposition) {
      const match = disposition.match(/filename="?(.+?)"?$/);
      if (match) filename = decodeURIComponent(match[1]);
    }
    
    // Add to playlist
    const url2 = URL.createObjectURL(blob);
    playlist.push({
      name: filename,
      url: url2,
      blob: new File([blob], filename, { type: 'audio/mpeg' }),
      size: blob.size,
      added: Date.now()
    });
    
    savePlaylist();
    renderTrackList();
    
    status.innerHTML = '✅ Téléchargé : ' + filename;
    status.className = 'success';
    document.getElementById('yt-url').value = '';
    showToast('Ajouté à la bibliothèque !');
    
  } catch(e) {
    status.textContent = '❌ ' + e.message;
    status.className = 'error';
    status.style.display = 'block';
  } finally {
    btn.disabled = false;
    // Auto-hide success after 5s
    if (status.className === 'success') {
      setTimeout(() => { status.style.display = 'none'; }, 5000);
    }
  }
}

// ===== UTILS =====
function formatTime(seconds) {
  if (!seconds || !isFinite(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + s.toString().padStart(2, '0');
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ===== DRAG & DROP =====
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = Array.from(e.dataTransfer.files).filter(f => 
    f.type.startsWith('audio/') || f.name.match(/\.(mp3|wav|ogg|flac|m4a|aac)$/i)
  );
  if (files.length > 0) {
    handleFiles({ target: { files, value: '' } });
  }
});

// Close modals on overlay click
document.getElementById('rename-modal').addEventListener('click', function(e) {
  if (e.target === this) closeRename();
});
document.getElementById('delete-modal').addEventListener('click', function(e) {
  if (e.target === this) closeDelete();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') audio.currentTime += 5;
  if (e.code === 'ArrowLeft') audio.currentTime -= 5;
});
</script>
</body>
</html>
